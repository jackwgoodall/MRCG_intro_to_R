name: lshtm-mrcg
title: LSHTM / MRC Gambia HTML + Reveal.js Formats
author: Jack Goodall
version: 0.2.0
quarto-required: ">=1.4.0"
contributes:
  formats:

    # ── Slides ───────────────────────────────────────────────────────────────
    revealjs:
      theme: [default, resources/theme-revealjs.scss]

      # Brand-coloured opening slide. Set here rather than in SCSS because
      # reveal.js paints backgrounds in a separate DOM layer.
      title-slide-attributes:
        data-background-color: "#0D5257"

      # Brand logo, bottom-right on every slide.
      logo: resources/logo.png
      footer: "LSHTM / MRC Unit The Gambia"

      slide-number: true
      progress: true
      history: true

      # Sensible teaching defaults: code stays readable, links open in place.
      code-block-height: 650px
      highlight-style: github
      incremental: false

    # ── Documents / website pages ────────────────────────────────────────────
    html:
      # ── Base theme (always present) ────────────────────────────────────────
      theme: [cosmo, resources/theme.scss]

      # ── Branded header bar + favicon (always present) ──────────────────────
      include-before-body: resources/header.html
      include-in-header: resources/favicon.html

      # ── Optional settings ──────────────────────────────────────────────────
      # Written here only for the arguments you pass to the install function
      # (toc, code-fold, self-contained, warning/message, ...). Anything you
      # leave unset is omitted so Quarto's own default applies.
      toc: true
